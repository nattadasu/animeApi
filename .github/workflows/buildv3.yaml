name: "[v3] Generate Database"

on:
  workflow_dispatch:
    inputs:
      force_fetch_hikka:
        description: "Force live fetch from Hikka API (ignores day gate)"
        type: boolean
        default: false
      force_fetch_nautiljon:
        description: "Force live scrape from Nautiljon (ignores day gate)"
        type: boolean
        default: false
      force_fetch_kaize:
        description: "Force live scrape from Kaize (no local cache fallback)"
        type: boolean
        default: false
      force_fetch_otakotaku:
        description: "Force full OtakOtaku re-fetch from ID 1 (ignores day gate)"
        type: boolean
        default: false
      force_dump:
        description: "Force database regeneration and commit even with no git changes"
        type: boolean
        default: false
  schedule:
    - cron: "0 5 * * *"
  push:
    branches:
      - v3
    paths:
      - "generator/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "uv.lock"
      - "api/index.py"
      - "api/robots.txt"
      - "api/favicon.ico"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  GIT_AUTHOR_NAME: Natsu Tadama
  GIT_AUTHOR_EMAIL: nattadasu@nattadasu.my.id
  GIT_COMMITTER_NAME: Natsu Tadama
  GIT_COMMITTER_EMAIL: nattadasu@nattadasu.my.id
  UV_FROZEN: "1"
  FORCE_FETCH_HIKKA: ${{ github.event.inputs.force_fetch_hikka || 'false' }}
  FORCE_FETCH_NAUTILJON: ${{ github.event.inputs.force_fetch_nautiljon || 'false' }}
  FORCE_FETCH_KAIZE: ${{ github.event.inputs.force_fetch_kaize || 'false' }}
  FORCE_FETCH_OTAKOTAKU: ${{ github.event.inputs.force_fetch_otakotaku || 'false' }}
  FORCE_DUMP: ${{ github.event.inputs.force_dump || 'false' }}

jobs:
  build:
    name: Build Database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: v3
          fetch-depth: 1

      - name: Wait for timestamp workflow to complete
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 18); do
            status=$(gh run list \
              --workflow=update-server-timestamp.yaml \
              --branch=v3 \
              --limit 1 \
              --json status \
              --jq '.[0].status // "completed"')
            if [[ "$status" == "completed" ]] || [[ -z "$status" ]]; then
              echo "Timestamp workflow completed or not running"
              break
            fi
            echo "Attempt $i/18 — status: $status, waiting 10 s..."
            sleep 10
          done

      - name: Pull latest changes
        run: git pull --rebase origin v3

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Load secrets to environment
        uses: oNaiPs/secrets-to-env-action@v1
        with:
          secrets: ${{ toJSON(secrets) }}

      - name: Snapshot status before generation
        run: |
          if [ -f api/status.json ]; then
            cp api/status.json /tmp/status_before.json
          else
            echo '{}' > /tmp/status_before.json
          fi

      - name: Generate database
        run: uv run python3 generator

      - name: Generate step summary
        if: always()
        run: |
          if [ ! -f api/status.json ]; then
            echo "No status.json found — skipping summary" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## Database Generation Summary"
            echo ""
            echo "### Count Changes"
            echo ""
            echo "| Platform | Before | After | Change |"
            echo "|----------|--------|-------|--------|"

            for platform in $(jq -r '.counts | keys[]' api/status.json | grep -v '^total$'); do
              before=$(jq -r ".counts.${platform} // 0" /tmp/status_before.json)
              after=$(jq -r ".counts.${platform} // 0" api/status.json)
              diff=$((after - before))
              change=$([ "$diff" -ge 0 ] && echo "+$diff" || echo "$diff")
              echo "| $platform | $before | $after | $change |"
            done

            before_total=$(jq -r '.counts.total // 0' /tmp/status_before.json)
            after_total=$(jq -r '.counts.total // 0' api/status.json)
            diff_total=$((after_total - before_total))
            change_total=$([ "$diff_total" -ge 0 ] && echo "+$diff_total" || echo "$diff_total")
            echo "| **Total** | **$before_total** | **$after_total** | **$change_total** |"
            echo ""
            echo "**Updated:** $(jq -r '.updated.iso' api/status.json)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git add .
            git commit -m "Update JSON for v3 at $(date -u +%Y-%m-%d) $(date -u +%H:%M:%S)"
            git push
          else
            echo "No changes to commit"
          fi

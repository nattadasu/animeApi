name: "[v2] Generate Database and Deploy to Pages"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"
  push:
    branches:
      - v2
    paths:
      - "main.py"
      - "requirements.txt"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  GIT_AUTHOR_NAME: Natsu Tadama
  GIT_AUTHOR_EMAIL: nattadasu@nattadasu.my.id
  GIT_COMMITTER_NAME: Natsu Tadama
  GIT_COMMITTER_EMAIL: nattadasu@nattadasu.my.id
  UV_FROZEN: "1"

jobs:
  Build:
    name: Build Database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: v2
          fetch-depth: 1

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Load secrets to environment variables
        uses: oNaiPs/secrets-to-env-action@v1
        with:
          secrets: ${{ toJSON(secrets) }}

      - name: Generate database
        run: uv run python3 main.py

      - name: Commit and push changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            git add .
            git commit -m "Update JSON for v2 at $(date -u +%Y-%m-%d) $(date -u +%H:%M:%S)"
            git push
          else
            echo "No changes to commit"
          fi

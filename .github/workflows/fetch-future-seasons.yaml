name: "Fetch Future Seasons"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0" # Every Sunday at 00:00 UTC

permissions:
  contents: write

env:
  GIT_AUTHOR_NAME: Natsu Tadama
  GIT_AUTHOR_EMAIL: nattadasu@nattadasu.my.id
  GIT_COMMITTER_NAME: Natsu Tadama
  GIT_COMMITTER_EMAIL: nattadasu@nattadasu.my.id
  UV_FROZEN: "1"

jobs:
  fetch:
    name: Fetch Seasonal Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: v3
          fetch-depth: 1

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Fetch future seasonal data
        run: uv run python3 scripts/fetch_future_seasons.py

      - name: Commit and push changes
        run: |
          if [[ -n $(git status --porcelain database/raw/sideload_future.json) ]]; then
            git add database/raw/sideload_future.json
            git commit -m "Automated fetch of future seasonal data"
            git push
          else
            echo "No changes in seasonal data"
          fi

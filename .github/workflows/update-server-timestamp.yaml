name: "Update API Server Timestamp"
on:
  push:
    branches:
      - v3
      - main
    paths:
      - "api/**"
      - "!api/.server_updated"
      - "!api/*.json"

permissions:
  contents: write

jobs:
  update-timestamp:
    name: Update .server_updated file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest commit timestamp for api folder
        id: get_timestamp
        run: |
          TIMESTAMP=$(git log -1 --format=%ct -- api/)
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "Latest API commit timestamp: $TIMESTAMP"

      - name: Update .server_updated file
        run: |
          echo "${{ steps.get_timestamp.outputs.timestamp }}" > api/.server_updated
          echo "Updated api/.server_updated with timestamp: ${{ steps.get_timestamp.outputs.timestamp }}"

      - name: Commit and push if changed
        run: |
          git config --local user.email "nattadasu@nattadasu.my.id"
          git config --local user.name "Natsu Tadama"
          git add api/.server_updated
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update API server timestamp"
            git push
          fi
